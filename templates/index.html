
<!DOCTYPE html>
<html>
<head>
    <title>Nyawie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        p {
            color: #777;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 13px 30px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">✨</div>

        <h1>Welcome!</h1>

        <p>
            Hello there! Welcome to my simple
            and beautiful webpage.
        </p>

        <button onclick="alert('Hello! Welcome to Nyawie!')">
            Get Started
        </button>

        <div class="footer">
            Made with ❤️ by Nyawie
        </div>
    </div>

</body>
</html>
